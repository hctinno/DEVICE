[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-rf-command-library"
version = "0.3.0"
description = "Evidence-indexed Samsung RF command catalog and automation SDK"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
research = ["requests>=2.32,<3", "PyMuPDF>=1.24,<2"]

[project.scripts]
dgm-rf = "dgm_rf.__main__:main"

[tool.setuptools.packages.find]
include = ["dgm_rf*"]

[tool.setuptools.package-data]
dgm_rf = ["data/*.json", "data/*.csv", "data/*.md"]
