[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-device-control"
version = "0.3.0"
description = "Evidence-indexed common entry point for instruments, facilities and smartphone RF control"
requires-python = ">=3.11"
dependencies = ["dgm-lab-control==0.4.0", "dgm-rf-command-library==0.5.0"]

[project.optional-dependencies]
visa = ["pyvisa>=1.14,<2"]
serial = ["pyserial>=3.5,<4"]

[project.scripts]
dgm-control = "dgm_control.__main__:main"

[tool.setuptools.packages.find]
include = ["dgm_control*"]

[tool.setuptools.package-data]
dgm_control = ["data/*.json"]
